name: P1 Security Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  p1-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orderai
          POSTGRES_PASSWORD: orderai
          POSTGRES_DB: orderai
        options: >-
          --health-cmd "pg_isready -U orderai -d orderai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+psycopg2://orderai:orderai@localhost:5432/orderai
      JWT_SECRET: ci-not-a-production-secret
      QUEUE_BACKEND: memory
      P1_INTAKE_ENABLED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install ".[dev]"
      - name: Verify migration head
        run: alembic upgrade head
      - name: Run P1 fail-closed security suite
        run: >-
          pytest -q
          tests/test_webhook_signature.py
          tests/test_webhook_fast.py
          tests/test_p1_intake.py
          tests/test_line_worker.py
          tests/test_worker_fail_closed_scenarios.py
          tests/test_p1_readiness.py
          tests/test_p1_delivery_service.py
      - name: Compile application and tests
        run: python -m compileall -q app tests
